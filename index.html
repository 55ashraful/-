<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন প্যানেল - ভাইরাল ভিডিও</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 15px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2 { color: #ff4757; font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #333; background: #2a2a2a; color: #fff; border-radius: 6px; font-size: 14px; }
    textarea { height: 90px; font-family: monospace; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-green { background: #2ed573; color: #000; }
    .btn-blue { background: #1e90ff; color: #fff; }
    .btn-orange { background: #ff7f50; color: #fff; }
    .btn-red { background: #ff4757; color: #fff; margin-top: 10px; }
    .current-info { margin-top: 12px; font-size: 13px; color: #70a1ff; word-break: break-all; line-height: 1.6; }
    #statusText { margin-top: 10px; font-size: 14px; color: #2ed573; text-align: center; font-weight: bold; }
    #adminSection { display: none; }
    #loginSection { max-width: 400px; margin: 50px auto; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3tgTH-Cp16LrJzAjgisfgvBTibRF0T4g",
      authDomain: "studio-ar1ak.firebaseapp.com",
      databaseURL: "https://studio-ar1ak-default-rtdb.firebaseio.com",
      projectId: "studio-ar1ak",
      storageBucket: "studio-ar1ak.firebasestorage.app",
      messagingSenderId: "77389723660",
      appId: "1:77389723660:web:2e35437b147041db02d629"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const CLOUD_NAME = "ssp47mxh"; 
    const UPLOAD_PRESET = "studio";

    // ১. লগইন ট্র্যাকিং (Auth State Check)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'block';
        loadSettings();
      } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminSection').style.display = 'none';
      }
    });

    // ২. এডমিন লগইন
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;
      const loginError = document.getElementById('loginError');

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        loginError.innerText = "";
      } catch (err) {
        loginError.innerText = "লগইন ব্যর্থ হয়েছে: " + err.message;
      }
    });

    // ৩. লগআউট
    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth);
    });

    // ৪. ভিডিও আপলোড (Cloudinary + Realtime DB)
    document.getElementById('videoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];
      const statusText = document.getElementById('statusText');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!file) {
        alert("একটি ভিডিও ফাইল বেছে নিন");
        return;
      }

      uploadBtn.disabled = true;
      statusText.innerText = "Cloudinary-তে ভিডিও আপলোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।";

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      try {
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.secure_url) {
          statusText.innerText = "ভিডিও আপলোড শেষ! ডাটাবেসে সেভ হচ্ছে...";

          const newVideoRef = push(ref(db, 'videos'));
          await set(newVideoRef, {
            title: title,
            videoUrl: data.secure_url,
            createdAt: Date.now()
          });

          statusText.innerText = "✅ ভিডিও সফলভাবে আপলোড ও সেভ হয়েছে!";
          document.getElementById('videoForm').reset();
        } else {
          alert("Cloudinary Error: " + (data.error?.message || "Upload Failed"));
          statusText.innerText = "❌ আপলোড ব্যর্থ হয়েছে!";
        }
      } catch (err) {
        alert("সমস্যা হয়েছে: " + err.message);
        statusText.innerText = "❌ আপলোড ব্যর্থ হয়েছে!";
      } finally {
        uploadBtn.disabled = false;
      }
    });

    // ৫. ক্লিক অ্যাড সেভ
    document.getElementById('adForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const adUrl = document.getElementById('adUrl').value;
      const adInterval = document.getElementById('adInterval').value;

      try {
        await set(ref(db, 'settings/adConfig/adUrl'), adUrl);
        await set(ref(db, 'settings/adConfig/adInterval'), adInterval);
        alert("ক্লিক অ্যাড সেটিং সেভ হয়েছে!");
      } catch (err) {
        alert("সেভ করা যায়নি: " + err.message);
      }
    });

    // ৬. ব্যানার অ্যাড সেভ
    document.getElementById('bannerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const bannerCode = document.getElementById('bannerCode').value;

      try {
        await set(ref(db, 'settings/adConfig/bannerCode'), bannerCode);
        alert("ব্যানার কোড সেভ হয়েছে!");
      } catch (err) {
        alert("সেভ করা যায়নি: " + err.message);
      }
    });

    // সেটিং লোড
    function loadSettings() {
      onValue(ref(db, 'settings/adConfig'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          document.getElementById('currentAdUrl').innerText = data.adUrl || "নাই";
          document.getElementById('currentAdInterval').innerText = (data.adInterval || "15") + " মিনিট";
          if (data.adUrl) document.getElementById('adUrl').value = data.adUrl;
          if (data.adInterval) document.getElementById('adInterval').value = data.adInterval;

          document.getElementById('currentBannerCode').innerText = data.bannerCode ? "সেভ করা আছে" : "নাই";
          if (data.bannerCode) document.getElementById('bannerCode').value = data.bannerCode;
        }
      });
    }
  </script>
</head>
<body>

  <!-- লগইন ফরম -->
  <div class="card" id="loginSection">
    <h2>🔒 এডমিন লগইন</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">এডমিন ইমেইল:</label>
        <input type="email" id="loginEmail" required placeholder="admin@gmail.com">
      </div>
      <div class="form-group">
        <label for="loginPass">পাসওয়ার্ড:</label>
        <input type="password" id="loginPass" required placeholder="******">
      </div>
      <button type="submit" class="btn-blue">লগইন করুন</button>
    </form>
    <div id="loginError" style="color: #ff4757; font-size: 13px; margin-top: 10px; text-align: center;"></div>
  </div>

  <!-- এডমিন প্যানেল (লগইন করার পর দেখাবে) -->
  <div id="adminSection">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 style="font-size: 20px; color: #ff4757;">এডমিন প্যানেল</h1>
      <button id="logoutBtn" class="btn-red" style="width: auto; padding: 8px 15px;">লগআউট</button>
    </div>

    <!-- ভিডিও আপলোড -->
    <div class="card">
      <h2>🎥 ফোন থেকে ভিডিও আপলোড</h2>
      <form id="videoForm">
        <div class="form-group">
          <label for="title">ভিডিও টাইটেল:</label>
          <input type="text" id="title" required placeholder="শিরোনাম লিখুন">
        </div>
        <div class="form-group">
          <label for="videoFile">গ্যালারি থেকে ভিডিও ফাইল সিলেক্ট করুন:</label>
          <input type="file" id="videoFile" accept="video/*" required>
        </div>
        <button type="submit" id="uploadBtn" class="btn-green">পাবলিশ করুন</button>
      </form>
      <div id="statusText"></div>
    </div>

    <!-- ক্লিক অ্যাড -->
    <div class="card">
      <h2>🎯 ভিডিও ক্লিক অ্যাড (Direct Link)</h2>
      <form id="adForm">
        <div class="form-group">
          <label for="adUrl">বিজ্ঞাপনের ডিরেক্ট লিংক (Direct Link):</label>
          <input type="url" id="adUrl" required placeholder="https://your-ad-network-link.com">
        </div>
        <div class="form-group">
          <label for="adInterval">কত সময় পর পর দেখাবে:</label>
          <select id="adInterval">
            <option value="5">৫ মিনিট পর পর</option>
            <option value="10">১০ মিনিট পর পর</option>
            <option value="15" selected>১৫ মিনিট পর পর</option>
            <option value="30">৩০ মিনিট পর পর</option>
            <option value="60">১ ঘণ্টা পর পর</option>
          </select>
        </div>
        <button type="submit" class="btn-blue">ক্লিক অ্যাড সেভ করুন</button>
      </form>
      
      <div class="current-info">
        <strong>বর্তমান লিংক:</strong> <span id="currentAdUrl">নাই</span><br>
        <strong>সময়সীমা:</strong> <span id="currentAdInterval">১৫ মিনিট</span>
      </div>
    </div>

    <!-- ব্যানার অ্যাড -->
    <div class="card">
      <h2>📜 নিচের স্থায়ী ব্যানার অ্যাড (Banner Script Code)</h2>
      <form id="bannerForm">
        <div class="form-group">
          <label for="bannerCode">অ্যাড নেটওয়ার্কের Script / HTML Code বসান:</label>
          <textarea id="bannerCode" required placeholder="<script ...></script> অথবা HTML Ad Code এখানে পেস্ট করুন"></textarea>
        </div>
        <button type="submit" class="btn-orange">ব্যানার কোড সেভ করুন</button>
      </form>

      <div class="current-info">
        <strong>স্ট্যাটাস:</strong> <span id="currentBannerCode">নাই</span>
      </div>
    </div>

  </div>

</body>
</html>
